<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101113" />
    <title>Words</title>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="add-button" aria-label="Add word">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        </button>
        <button class="icon-button" id="library-button" aria-label="Open word library">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="14" height="20" rx="2"/><path d="M10 2v20M3 6h4M3 10h4M3 14h4M3 18h4"/></svg>
        </button>
      </header>

      <section id="review-view" class="view active" aria-live="polite"></section>
      <section id="add-view" class="view" aria-live="polite"></section>
      <section id="library-view" class="view" aria-live="polite"></section>
    </main>

    <script src="config.js"></script>
    <script src="app.js?v=2"></script>
  </body>
</html>
