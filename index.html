<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101113" />
    <title>Words</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="add-button" aria-label="Add word">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-button" id="library-button" aria-label="Open word library">
          <i data-lucide="notebook-tabs"></i>
        </button>
      </header>

      <section id="review-view" class="view active" aria-live="polite"></section>
      <section id="add-view" class="view" aria-live="polite"></section>
      <section id="library-view" class="view" aria-live="polite"></section>
    </main>

    <template id="empty-review-template">
      <div class="empty-state">
        <p class="eyebrow">All clear</p>
        <h2>Nothing due today.</h2>
        <p>New words will come back here when it is time to see them again.</p>
      </div>
    </template>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
